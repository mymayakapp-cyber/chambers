<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chambers — case planning for lawyers</title>
<meta name="description" content="Shared court-case planning for lawyers. Everyone can view; only the owner can edit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F3B2D'/%3E%3Cpath d='M16 6v20M9 11h14M9 11l-3 7h6zM23 11l-3 7h6zM11 26h10' stroke='%23D9B25C' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --green:#1F3B2D; --green-2:#2B4F3D; --green-ink:#E8EFEA;
  --brass:#B8892B; --brass-2:#D9B25C; --jacket:#EFE6CF; --jacket-line:#D8C79F;
  --paper:#F4F6F3; --card:#FFFFFF; --ink:#1B2420; --muted:#5C6963; --line:#DBE1DC;
  --seal:#9E2A2B; --seal-soft:#F7E4E2; --ok:#2E6B47; --ok-soft:#E1EFE6; --amber-soft:#FBF0D6;
  --radius-s:6px; --radius:10px;
  --serif:"Libre Caslon Text", Georgia, serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#121916; --card:#1A231F; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2C3833;
    --jacket:#2A2618; --jacket-line:#4A4128; --seal-soft:#3A1E1E; --ok-soft:#1C3326; --amber-soft:#332A15;
    --green:#16291F; --green-2:#203B2E;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--green);color:var(--green-ink);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:var(--serif);font-size:22px;color:#fff;text-decoration:none}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-s);text-decoration:none;color:var(--green-ink);opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);opacity:1}
.nav a.on{background:rgba(217,178,92,.16);color:#fff;opacity:1;box-shadow:inset 3px 0 0 var(--brass-2)}
.nav svg{width:18px;height:18px;flex:none}
.side .new{margin:18px 0 0;justify-content:center}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0;font-size:13px}
.me b{display:block;font-weight:600;color:#fff;font-size:14px}
.me button{background:none;border:0;color:var(--brass-2);padding:0;margin-top:8px;cursor:pointer;font-size:13px}
.demo-flag{font-size:12px;background:rgba(217,178,92,.18);color:var(--brass-2);border-radius:4px;padding:2px 6px;display:inline-block;margin-top:6px}
.main{min-width:0;padding:32px 40px 80px;max-width:1180px}
.topbar,.tabbar{display:none}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:var(--radius-s);padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2;background:var(--card);border-color:var(--line);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.primary:hover{background:#A57A24}
.btn.dark{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--seal);border-color:color-mix(in srgb,var(--seal) 35%,transparent)}
.btn.ghost{background:none;border-color:transparent;padding:6px 8px;color:var(--muted);font-weight:500}
.btn.ghost:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-s);padding:9px 11px;font-size:15px;font-weight:400;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.55}
.hint{font-weight:400;font-size:12.5px;color:var(--muted)}

/* ---------- Page heads ---------- */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.phead h1{font-size:34px}
.phead p{margin:6px 0 0;color:var(--muted)}

/* ---------- Dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
.panel h2{font-size:20px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.counts{display:flex;gap:28px;margin:0 0 26px;flex-wrap:wrap}
.counts div{font-size:13.5px;color:var(--muted)}
.counts b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;color:var(--ink);line-height:1.1}
.counts .warn b{color:var(--seal)}

/* Agenda / cause list */
.day{margin-top:16px}
.day:first-child{margin-top:0}
.dayhead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
.dayhead h3{font-size:17px}
.dayhead span{font-size:13px;color:var(--muted)}
.dayhead.today h3{color:var(--brass)}
.dayhead.over h3{color:var(--seal)}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:start;padding:10px 4px;border-radius:var(--radius-s);text-decoration:none}
a.row:hover{background:color-mix(in srgb,var(--brass) 7%,transparent)}
.row .no{font-family:var(--serif);color:var(--muted);text-align:right;padding-top:1px}
.row .t{font-weight:600}
.row .m{font-size:13.5px;color:var(--muted)}
.row .r{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.kind{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;margin-right:6px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.kind.hearing{background:var(--seal-soft);color:var(--seal)}
.kind.task{background:var(--amber-soft);color:#8A6418}
@media (prefers-color-scheme: dark){.kind.task{color:var(--brass-2)}}

.feed .row{grid-template-columns:1fr auto}

/* ---------- Case list ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.filters .inp{width:auto;min-width:160px}
.filters .search{flex:1;min-width:200px}
.table{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.5fr) 130px 150px;gap:16px;padding:14px 18px;border-top:1px solid var(--line);text-decoration:none;align-items:center}
.trow:first-child{border-top:0}
.trow.headr{font-size:12.5px;font-weight:600;color:var(--muted);padding-top:10px;padding-bottom:10px;background:color-mix(in srgb,var(--ink) 3%,transparent)}
a.trow:hover{background:color-mix(in srgb,var(--brass) 6%,transparent)}
.trow .title{font-family:var(--serif);font-size:16.5px;line-height:1.3}
.trow .suit{font-size:13px;color:var(--muted);margin-top:2px}
.trow .small{font-size:13.5px;color:var(--muted)}
.owner{display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.mine-dot{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:1px 6px}
.status{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.status.Open{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.status.Adjourned{color:#8A6418;border-color:color-mix(in srgb,var(--brass) 50%,transparent)}
.status.Judgment.reserved,.status.reserved{color:var(--seal);border-color:color-mix(in srgb,var(--seal) 40%,transparent)}
.status.Closed{color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}

/* ---------- Case file (the jacket) ---------- */
.ribbon{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--brass) 40%,transparent);color:var(--ink);border-radius:var(--radius-s);padding:10px 14px;margin-bottom:18px;font-size:14px}
.ribbon svg{flex:none;color:var(--brass)}
.jacket{position:relative;background:var(--jacket);border:1px solid var(--jacket-line);border-radius:4px var(--radius) var(--radius) var(--radius);padding:30px 32px 24px;margin-top:22px}
.jacket .tab{position:absolute;top:-23px;left:-1px;background:var(--jacket);border:1px solid var(--jacket-line);border-bottom:0;border-radius:8px 8px 0 0;padding:3px 16px 2px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.jacket .suitno{font-family:var(--serif);font-size:15px;letter-spacing:.02em;color:var(--muted)}
.jacket h1{font-size:34px;margin:6px 0 4px;max-width:30ch}
.jacket .court{font-size:15px;color:var(--muted)}
.jgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 22px;margin-top:22px;padding-top:18px;border-top:1px dashed var(--jacket-line)}
.jgrid dt{font-size:12.5px;color:var(--muted);font-weight:600}
.jgrid dd{margin:2px 0 0;font-size:15px}
.jgrid .hear{color:var(--seal);font-weight:600}
.jactions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:28px}
.sec{margin-bottom:28px}
.sec h2{font-size:21px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h2 small{font-family:var(--sans);font-size:13px;color:var(--muted)}
.prose{white-space:pre-wrap;margin:0;line-height:1.65;max-width:68ch}
.prose.blank{color:var(--muted);font-style:italic}

/* Plan */
.plan{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.plan li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok)}
.plan .pt{font-weight:600}
.plan li.done .pt{text-decoration:line-through;color:var(--muted);font-weight:500}
.plan .pm{font-size:13px;color:var(--muted)}
.plan .od{color:var(--seal);font-weight:600}
.addplan{display:grid;grid-template-columns:1fr 130px 150px auto;gap:8px;margin-top:10px}

/* Notes */
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.note.mine{border-left:3px solid var(--brass)}
.note header{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.note header .when{color:var(--muted);margin-left:auto;font-size:12.5px}
.note p{margin:0;white-space:pre-wrap;line-height:1.6}
.note .acts{display:flex;gap:4px;margin-top:8px}
.addnote{margin-bottom:16px}
.addnote .row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}

/* Form page */
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 18px;max-width:900px}
.form .c6{grid-column:span 6}.form .c4{grid-column:span 4}.form .c3{grid-column:span 3}.form .c2{grid-column:span 2}
.form fieldset{border:0;padding:0;margin:0;display:contents}
.form .legend{grid-column:span 6;font-family:var(--serif);font-size:19px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.form .legend:first-child{margin-top:0;padding-top:0;border-top:0}
.formacts{grid-column:span 6;display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

/* ---------- Auth ---------- */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.auth .art{background:var(--green);color:var(--green-ink);padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .art h1{font-size:46px;color:#fff;max-width:13ch;line-height:1.12}
.auth .art p{max-width:42ch;font-size:16.5px;opacity:.88;line-height:1.6}
.auth .art .rule{display:grid;gap:10px;margin-top:26px;font-size:15px}
.auth .art .rule div{display:flex;gap:10px;align-items:flex-start}
.auth .art .rule svg{flex:none;color:var(--brass-2);margin-top:2px}
.auth .art .scales{position:absolute;right:-60px;bottom:-40px;opacity:.07;width:380px;height:380px;color:#fff}
.auth .box{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth .card{width:100%;max-width:400px}
.auth .card h2{font-size:28px;margin-bottom:6px}
.auth form{display:grid;gap:14px;margin-top:22px}
.auth .switch{margin-top:18px;font-size:14px;color:var(--muted)}
.auth .switch button{background:none;border:0;color:var(--brass);font-weight:600;cursor:pointer;padding:0}
.err{background:var(--seal-soft);color:var(--seal);border-radius:var(--radius-s);padding:9px 12px;font-size:14px}
.info{background:var(--ok-soft);color:var(--ok);border-radius:var(--radius-s);padding:9px 12px;font-size:14px}
.demo-list{display:grid;gap:8px;margin-top:20px}
.demo-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer}
.demo-list button:hover{border-color:var(--brass)}
.demo-list .av{width:34px;height:34px;font-size:13px}
.demo-list small{display:block;color:var(--muted);font-size:13px}

/* Toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:11px 18px;border-radius:var(--radius-s);font-size:14px;opacity:0;transition:opacity .2s, transform .2s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--seal)}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .dash,.cols{grid-template-columns:1fr}
  .jgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow{grid-template-columns:minmax(0,1fr) 130px}
  .trow .c-court,.trow .c-owner{display:none}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--green);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10}
  .topbar .brand{padding:0;font-size:19px}
  .topbar .btn{padding:7px 11px}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:12px;text-decoration:none;color:var(--muted)}
  .tabbar a.on{color:var(--green);font-weight:700}
  @media (prefers-color-scheme: dark){.tabbar a.on{color:var(--brass-2)}}
  .tabbar svg{width:20px;height:20px}
  .main{padding:20px 16px 96px}
  .panel{padding:16px}
  .row{grid-template-columns:40px 1fr;gap:4px 10px}
  .row .r{grid-column:2;text-align:left}
  .feed .row{grid-template-columns:1fr}
  .feed .row .r{grid-column:1}
  .phead h1{font-size:28px}
  .jacket{padding:24px 18px 20px}
  .jacket h1{font-size:26px}
  .trow{grid-template-columns:1fr;gap:6px}
  .trow.headr{display:none}
  .trow .c-hear{font-size:13.5px}
  .addplan{grid-template-columns:1fr 1fr}
  .addplan input[name=title]{grid-column:span 2}
  .form{grid-template-columns:1fr;padding:18px}
  .form .c6,.form .c4,.form .c3,.form .c2,.form .legend,.formacts{grid-column:span 1}
  .auth{grid-template-columns:1fr}
  .auth .art{padding:36px 22px}
  .auth .art h1{font-size:34px}
  .filters .inp{min-width:0;flex:1}
  .counts{gap:20px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">Opening chambers…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   Chambers — shared case planning for lawyers
   Rule: every signed-in lawyer can view everything; you can edit only
   what you own. Enforced by Supabase Row Level Security (schema.sql)
   and mirrored in the interface. Demo mode mirrors the same rules.
   ===================================================================== */
const CFG = window.CHAMBERS_CONFIG || {};
const FORCE_DEMO = new URLSearchParams(location.search).has('demo');
const DEMO = FORCE_DEMO || !(CFG.supabaseUrl && CFG.supabaseAnonKey);

const COURTS = [
  'Supreme Court, Accra','Court of Appeal, Accra','Court of Appeal, Kumasi',
  'High Court (Commercial Division), Accra','High Court (Land Division), Accra','High Court (Family Division), Accra',
  'High Court (Labour Division), Accra','High Court (General Jurisdiction), Accra','High Court, Kumasi','High Court, Takoradi',
  'Circuit Court, Accra','Circuit Court, Tema','District Court, Accra'
];
const TYPES = ['Civil','Commercial','Criminal','Land','Family','Labour','Constitutional','Probate'];
const STATUSES = ['Open','Adjourned','Judgment reserved','Closed'];
const ROLES = ['Plaintiff','Defendant','Applicant','Respondent','Appellant','Petitioner','Accused','Complainant'];
const KINDS = ['Filing','Hearing prep','Research','Client meeting','Witness','Correspondence','Other'];

/* ---------------- helpers ---------------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const daysBetween = (a, b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000);
const fmtDate = (iso, opts={weekday:'short', day:'numeric', month:'short'}) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', opts) : '';
const fmtLong = iso => fmtDate(iso, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const relDay = iso => { const n = daysBetween(todayISO(), iso); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : n < 0 ? `${-n} days ago` : `In ${n} days`; };
const fmtWhen = ts => { const d = new Date(ts); const diff = (Date.now() - d) / 1000;
  if (diff < 60) return 'just now'; if (diff < 3600) return Math.floor(diff/60) + ' min ago';
  if (diff < 86400) return Math.floor(diff/3600) + ' h ago';

/* ---------- Supabase store ---------- */
const SupaStore = (() => {
  if (DEMO) return null;
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const ok = ({data, error}) => { if (error) throw new Error(friendly(error)); return data; };
  function friendly(e){
    const m = e.message || String(e);
    if (/row-level security|permission denied|violates/i.test(m)) return 'Only the owner can change this.';
    if (/Invalid login/i.test(m)) return 'Email or password is incorrect.';
    if (/Email not confirmed/i.test(m)) return 'Confirm your email first — check your inbox for the link.';
    return m;
  }
  let me = null;
  async function loadMe(user){
    if (!user) { me = null; return null; }
    const {data} = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    me = data || {id:user.id, full_name:user.user_metadata?.full_name || user.email, firm:user.user_metadata?.firm || '', email:user.email};
    return me;
  }
  const clean = c => { const o = {...c}; delete o.id; delete o.owner_id; delete o.created_at; delete o.updated_at; if (!o.next_hearing) o.next_hearing = null; return o; };
  return {
    client: sb,
    async session(){ const {data} = await sb.auth.getSession(); return loadMe(data.session?.user); },
    async signIn(email, pw){ const d = ok(await sb.auth.signInWithPassword({email, password:pw})); return loadMe(d.user); },
    async signUp(email, pw, full_name, firm){
      const d = ok(await sb.auth.signUp({email, password:pw, options:{data:{full_name, firm}, emailRedirectTo:location.origin}}));
      if (d.session) { await loadMe(d.user); return {user:me}; }
      return {confirm:true};
    },
    async signOut(){ await sb.auth.signOut(); me = null; },
    async profiles(){ return ok(await sb.from('profiles').select('id,full_name,firm,email')); },
    async cases(){ return ok(await sb.from('cases').select('*').order('updated_at', {ascending:false})); },
    async allPlan(){ return ok(await sb.from('plan_items').select('*')); },
    async notesFor(caseId){ return ok(await sb.from('notes').select('*').eq('case_id', caseId)); },
    async recentNotes(){ return ok(await sb.from('notes').select('*').order('created_at', {ascending:false}).limit(20)); },
    async saveCase(c){
      if (c.id) { const rows = ok(await sb.from('cases').update(clean(c)).eq('id', c.id).select()); if (!rows.length) DENY('case'); return rows[0]; }
      return ok(await sb.from('cases').insert({...clean(c), owner_id:me.id}).select().single());
    },
    async deleteCase(id){ const rows = ok(await sb.from('cases').delete().eq('id', id).select('id')); if (!rows.length) DENY('case'); },
    async addPlan(it){ return ok(await sb.from('plan_items').insert({...it, owner_id:me.id}).select().single()); },
    async updatePlan(id, patch){ const rows = ok(await sb.from('plan_items').update(patch).eq('id', id).select()); if (!rows.length) DENY('plan step'); return rows[0]; },
    async deletePlan(id){ const rows = ok(await sb.from('plan_items').delete().eq('id', id).select('id')); if (!rows.length) DENY('plan step'); },
    async addNote(caseId, body){ return ok(await sb.from('notes').insert({case_id:caseId, body, owner_id:me.id}).select().single()); },
    async updateNote(id, body){ const rows = ok(await sb.from('notes').update({body}).eq('id', id).select()); if (!rows.length) DENY('note'); return rows[0]; },
    async deleteNote(id){ const rows = ok(await sb.from('notes').delete().eq('id', id).select('id')); if (!rows.length) DENY('note'); },
  };
})();

async function refresh(){
  const [ps, cs, pl] = await Promise.all([API.profiles(), API.cases(), API.allPlan()]);
  S.profiles = Object.fromEntries(ps.map(p => [p.id, p])); S.cases = cs; S.plan = pl;

function route(){ const h = location.hash.replace(/^#\/?/, ''); const [a, b, c] = h.split('/'); return {a: a || 'dashboard', b, c}; }
window.addEventListener('hashchange', render);

async function boot(){
  try { S.me = await API.session(); } catch(e) { S.me = null; }
  if (!DEMO) SupaStore.client.auth.onAuthStateChange((ev, sess) => { if (ev === 'SIGNED_OUT') { S.me = null; render(); } });
  render();
}

async function render(){
  const app = $('#app');
  if (!S.me) { app.innerHTML = authView(); return; }
  try { await refresh(); } catch(e) { app.innerHTML = shell(`<div class="empty"><h3>Could not load cases</h3><p>${esc(e.message)}</p><button class="btn" data-act="reload">Try again</button></div>`); return; }
  const r = route(); let body;
  if (r.a === 'cases') body = casesView();
  else if (r.a === 'cause-list') body = causeListView();
  else if (r.a === 'new') body = formView(null);
  else if (r.a === 'case' && r.c === 'edit') body = formView(caseById(r.b));
  else if (r.a === 'case') body = await caseView(r.b);
  else body = dashView();
  app.innerHTML = shell(body, r.a);
  window.scrollTo(0, 0);
  const f = $('#main [autofocus]'); if (f) f.focus();
}

/* ---- Agenda helpers ---- */
function agendaItems(scope, from, to){
  const items = [];
  for (const c of S.cases) {
    if (!c.next_hearing || c.status === 'Closed') continue;
    if (scope === 'mine' && !isMine(c)) continue;
    if (from && c.next_hearing < from) continue; if (to && c.next_hearing > to) continue;
    items.push({type:'hearing', date:c.next_hearing, time:c.hearing_time || '', c});
  }
  return items;
}
function taskItems(scope, to){
  return S.plan.filter(p => !p.done && p.due_date && (scope !== 'mine' || isMine(p)) && (!to || p.due_date <= to))
    .map(p => ({type:'task', date:p.due_date, time:'', p, c:caseById(p.case_id)})).filter(x => x.c);
}
function groupByDate(items){
  const g = {}; for (const it of items) (g[it.date] ||= []).push(it);
  return Object.keys(g).sort().map(d => ({date:d, items:g[d].sort((a,b) => (a.type === b.type ? 0 : a.type === 'hearing' ? -1 : 1) || (a.time||'').localeCompare(b.time||''))}));
}
function dayHead(date, count, label){
  const t = todayISO(); const cls = date === t ? 'today' : date < t ? 'over' : '';
  return `<div class="dayhead ${cls}"><h3>${date < t ? 'Overdue' : esc(fmtDate(date,{weekday:'long', day:'numeric', month:'long'}))}</h3><span>${date < t ? '' : esc(relDay(date)) + ' · '}${count} ${label}</span></div>`;
}

/* ---- Dashboard ---- */
function dashView(){
  const t = todayISO(), end = addDays(t, 14);
  const mine = S.cases.filter(isMine), active = mine.filter(c => c.status !== 'Closed');
  const hearings = agendaItems('mine', t, end);
  let tasks = taskItems('mine', end);
  const overdue = tasks.filter(x => x.date < t);
  // fold overdue tasks into one group
  const items = [...hearings, ...tasks.map(x => x.date < t ? {...x, date:addDays(t,-1)} : x)];
  const groups = groupByDate(items);
  const first = S.me.full_name.split(' ')[0];
  const hour = new Date().getHours(); const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

  const week = groups.length ? groups.map(g => `<div class="day">${dayHead(g.date, g.items.length, g.items.length === 1 ? 'item' : 'items')}
      ${g.items.map(it => it.type === 'hearing'
        ? `<a class="row" href="#/case/${it.c.id}"><span class="no">${it.time ? esc(it.time) : '·'}</span><span><span class="kind hearing">Hearing</span><span class="t">${esc(it.c.title)}</span><div class="m">${esc(it.c.court)}${it.c.judge ? ' · ' + esc(it.c.judge) : ''}</div></span><span class="r">${esc(it.c.suit_number)}</span></a>`
        : `<a class="row" href="#/case/${it.c.id}"><span class="no"></span><span><span class="kind task">${esc(it.p.kind)}</span><span class="t">${esc(it.p.title)}</span><div class="m">${esc(it.c.title)}</div></span><span class="r ${it.p.due_date < t ? 'od' : ''}" style="${it.p.due_date < t ? 'color:var(--seal);font-weight:600' : ''}">${it.p.due_date < t ? 'Due ' + esc(fmtDate(it.p.due_date)) : ''}</span></a>`).join('')}</div>`).join('')
    : `<div class="empty"><h3>Nothing in the next two weeks</h3><p>Add a hearing date or plan steps to your cases and they will appear here.</p><a class="btn primary" href="#/new">${ICON.plus}New case</a></div>`;

  // activity across chambers: recently updated cases by others + notes
  const recent = S.cases.slice().sort((a,b) => b.updated_at.localeCompare(a.updated_at)).slice(0, 6);
  const feed = recent.map(c => { const p = prof(c.owner_id); return `<a class="row" href="#/case/${c.id}"><span><span class="t" style="font-family:var(--serif);font-weight:400">${esc(c.title)}</span><div class="m">${isMine(c) ? 'You' : esc(p.full_name)} · updated ${esc(fmtWhen(c.updated_at))}</div></span><span class="r"><span class="status ${esc(c.status)}">${esc(c.status)}</span></span></a>`; }).join('');

  return `<div class="phead"><div><h1>${greet}, ${esc(first)}</h1><p>${esc(fmtLong(t))}</p></div></div>
    <div class="counts">
      <div><b class="tnum">${active.length}</b>Your active cases</div>
      <div><b class="tnum">${hearings.length}</b>Hearings in 14 days</div>
      <div class="${overdue.length ? 'warn' : ''}"><b class="tnum">${overdue.length}</b>Overdue plan steps</div>
      <div><b class="tnum">${S.cases.length}</b>Cases across chambers</div>
    </div>
    <div class="dash">
      <section class="panel"><h2>Your next two weeks</h2><p class="sub">Hearings and plan steps on cases you own.</p>${week}</section>
      <section class="panel feed"><h2>Across chambers</h2><p class="sub">Recently updated cases. Open any file to read it.</p>${feed || '<p class="muted">No cases yet.</p>'}</section>
    </div>`;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
const confirmDo = msg => window.confirm(msg);
async function guard(fn, okMsg){ try { await fn(); if (okMsg) toast(okMsg); } catch(e) { toast(e.message || 'Something went wrong.', true); } }

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'toggle-plan') return; // handled on change
  e.preventDefault();
  if (act === 'signout') { await API.signOut(); S.me = null; location.hash = '#/'; render(); }
  else if (act === 'reset-demo') { if (confirmDo('Reset the demo to its sample data? Your changes in this browser will be lost.')) { DemoStore.reset(); toast('Demo reset'); render(); } }
  else if (act === 'reload') render();
  else if (act === 'auth-mode') { S.authMode = b.dataset.m; render(); }
  else if (act === 'demo-as') { S.me = await DemoStore.signInAs(id); location.hash = '#/dashboard'; render(); }
  else if (act === 'scope') { S.listScope = b.dataset.v; render(); }
  else if (act === 'cscope') { S.causeScope = b.dataset.v; render(); }
  else if (act === 'del-case') { if (confirmDo('Delete this case with all its plan steps and notes? This cannot be undone.')) await guard(async () => { await API.deleteCase(id); location.hash = '#/cases'; }, 'Case deleted'); }
  else if (act === 'del-plan') await guard(async () => { await API.deletePlan(id); await render(); }, 'Step removed');
  else if (act === 'del-note') { if (confirmDo('Delete this note?')) await guard(async () => { await API.deleteNote(id); await render(); }, 'Note deleted'); }
  else if (act === 'edit-note') {
    const art = document.querySelector(`[data-note="${id}"]`); const p = art.querySelector('p'); const body = p.textContent;
    art.querySelector('.acts').remove();
    p.outerHTML = `<form data-form="edit-note" data-id="${id}"><textarea class="inp" name="body" required>${esc(body)}</textarea>
      <div class="acts"><button class="btn dark sm" type="submit">Save note</button><button class="btn ghost sm" type="button" data-act="reload">Cancel</button></div></form>`;
    art.querySelector('textarea').focus();
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.act === 'toggle-plan') await guard(async () => { await API.updatePlan(el.dataset.id, {done: el.checked}); await render(); }, el.checked ? 'Step done' : 'Step reopened');
  else if (el.dataset.input === 'fStatus' || el.dataset.input === 'fCourt') { S[el.dataset.input] = el.value; render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'q') { S.q = el.value; clearTimeout(S._qt); S._qt = setTimeout(async () => { const pos = el.selectionStart; await render(); const n = $('[data-input="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 220); }
});

document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault();
  const data = Object.fromEntries(new FormData(f).entries());
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  const done = () => { if (btn) btn.disabled = false; };
  const kind = f.dataset.form;
  if (kind === 'signin' || kind === 'signup') {
    const msg = $('#auth-msg');
    try {
      if (kind === 'signin') S.me = await API.signIn(data.email, data.password);
      else { const r = await API.signUp(data.email, data.password, data.full_name.trim(), (data.firm || '').trim());
        if (r.confirm) { msg.innerHTML = '<div class="info">Account created. Check your email for the confirmation link, then sign in.</div>'; done(); return; }
        S.me = r.user; }
      location.hash = '#/dashboard'; render();
    } catch(err) { msg.innerHTML = `<div class="err">${esc(err.message)}</div>`; done(); }
    return;
  }
  if (kind === 'case') {
    await guard(async () => { const saved = await API.saveCase({...data, id: f.dataset.id || undefined}); location.hash = '#/case/' + saved.id; }, f.dataset.id ? 'Changes saved' : 'Case created');
    done(); return;
  }
  if (kind === 'plan') { await guard(async () => { await API.addPlan({case_id:f.dataset.case, title:data.title.trim(), kind:data.kind, due_date:data.due_date || null}); await render(); }, 'Step added'); done(); return; }
  if (kind === 'note') { await guard(async () => { await API.addNote(f.dataset.case, data.body.trim()); await render(); }, 'Note added'); done(); return; }
  if (kind === 'edit-note') { await guard(async () => { await API.updateNote(f.dataset.id, data.body.trim()); await render(); }, 'Note saved'); done(); return; }
});

boot();
</script>
</body>
</html>
